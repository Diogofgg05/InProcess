name: Generate Numerical Physics 6.1 PDF
on:
  push:
    branches: [feature/inprocess-6-1-numerical-physics]
    paths:
      - 'examples/generate_lab61_pdf.py'
      - 'src/expecto_process_manager/physics/heat_implicit.py'
      - '.github/workflows/lab61-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inprocess-lab61-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF generator
        run: python -m pip install 'reportlab>=4,<5'
      - name: Generate and verify PDF
        env:
          PYTHONPATH: src
        run: |
          python examples/generate_lab61_pdf.py --output docs/relatorios/InProcess_Numerical_Physics_6_1.pdf
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/relatorios/InProcess_Numerical_Physics_6_1.pdf')
          assert p.stat().st_size > 10000 and p.read_bytes().startswith(b'%PDF-')
          print('Academic PDF verified:',p.stat().st_size,'bytes')
          PY
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: inprocess-numerical-physics-6-1
          path: docs/relatorios/InProcess_Numerical_Physics_6_1.pdf
      - name: Commit PDF to feature branch
        if: github.ref_name == 'feature/inprocess-6-1-numerical-physics'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/relatorios/InProcess_Numerical_Physics_6_1.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate Numerical Physics Lab 6.1 PDF [skip ci]"
            # Avoid overwriting any intervening commits.
            git fetch origin feature/inprocess-6-1-numerical-physics
            git rebase origin/feature/inprocess-6-1-numerical-physics
            git push origin HEAD:feature/inprocess-6-1-numerical-physics
          fi
